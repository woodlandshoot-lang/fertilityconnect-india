# nginx.conf
# Production reverse proxy + SSL + rate limiting

events {
    worker_connections 1024;
}

http {
    # ── Rate Limiting Zones ──────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_global:10m  rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=30r/m;

    # ── Gzip ────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 1000;

    # ── Upstream API ─────────────────────────────────────────
    upstream api_backend {
        server api:4000;
        keepalive 32;
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────
    server {
        listen 80;
        server_name api.fertilityconnect.in fertilityconnect.in;
        return 301 https://$server_name$request_uri;
    }

    # ── HTTPS API Server ──────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.fertilityconnect.in;

        ssl_certificate     /etc/letsencrypt/live/fertilityconnect.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fertilityconnect.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ── Security Headers ─────────────────────────────────
        add_header X-Frame-Options           "DENY";
        add_header X-Content-Type-Options    "nosniff";
        add_header X-XSS-Protection          "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        add_header Referrer-Policy           "strict-origin-when-cross-origin";

        # ── Webhook (raw body, no rate limit) ────────────────
        location /api/payments/webhook {
            limit_req zone=api_webhook burst=10;
            proxy_pass http://api_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Auth routes (strict rate limit) ──────────────────
        location ~ ^/api/auth/(register|login|otp) {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── All other API routes ──────────────────────────────
        location /api/ {
            limit_req zone=api_global burst=20 nodelay;
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── Health check (no rate limit) ─────────────────────
        location /health {
            proxy_pass http://api_backend;
            access_log off;
        }
    }
}
