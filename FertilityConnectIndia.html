<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FertilityConnect India</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --saffron:#E8722A;--saffron-lt:#F5A06E;--saffron-dk:#C05A18;
  --teal:#0B7B6E;--teal-lt:#13A898;--teal-pale:#E6F5F3;
  --cream:#FDF8F2;--warm:#FFFCF8;
  --ink:#1A1410;--ink60:#6B5B4E;--ink30:#C4B8AE;
  --gold:#D4A843;--rose:#E85B6A;
  --shadow:0 2px 20px rgba(26,20,16,.08);
  --shadow-h:0 8px 40px rgba(26,20,16,.16);
  --r:16px;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--ink30);border-radius:3px}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes floatUpDown{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-10px)}}
@keyframes badgePop{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

.au{animation:fadeUp .45s ease both}
.au2{animation:fadeUp .45s .1s ease both}
.au3{animation:fadeUp .45s .2s ease both}
.au4{animation:fadeUp .45s .3s ease both}
.au5{animation:fadeUp .45s .4s ease both}

#app{display:flex;flex-direction:column;min-height:100vh}
.page{flex:1;padding-bottom:74px}

/* ── SPLASH ── */
#splash{
  position:fixed;inset:0;z-index:500;
  background:linear-gradient(160deg,#0B7B6E 0%,#065C52 45%,#1A1410 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px 48px;overflow:hidden;
}
#splash::before{content:'';position:absolute;top:-80px;right:-80px;width:260px;height:260px;border-radius:50%;background:rgba(232,114,42,.12);pointer-events:none}
#splash::after{content:'';position:absolute;bottom:-100px;left:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.splash-icon{width:140px;height:140px;border-radius:40px;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 50px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.2);animation:floatUpDown 3s ease-in-out infinite;margin-bottom:18px;overflow:hidden;flex-shrink:0}
.splash-brand{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:#fff;text-align:center;line-height:1.1}
.splash-brand span{color:var(--saffron-lt)}
.splash-tagline{font-size:13px;color:rgba(255,255,255,.55);text-align:center;margin-top:5px;margin-bottom:32px}
.splash-q{font-size:18px;font-weight:700;color:#fff;text-align:center;margin-bottom:18px;font-family:'Playfair Display',serif}
.splash-q span{color:var(--saffron-lt)}
.role-cards{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.role-card{
  width:100%;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
  border-radius:20px;padding:20px 18px;display:flex;align-items:center;gap:14px;
  cursor:pointer;border:2px solid rgba(255,255,255,.12);
  transition:background .2s,border-color .2s,transform .15s;text-align:left;
}
.role-card:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.role-card:active{transform:translateY(0)}
.role-icon{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.ri-patient{background:rgba(232,114,42,.25)}
.ri-hospital{background:rgba(11,123,110,.35)}
.role-text h3{font-size:17px;font-weight:700;color:#fff;margin-bottom:3px}
.role-text p{font-size:12px;color:rgba(255,255,255,.6);line-height:1.5}
.role-arrow{margin-left:auto;font-size:18px;color:rgba(255,255,255,.4);flex-shrink:0}
.splash-stats{display:flex;gap:20px;margin-top:28px;justify-content:center}
.ss-val{font-size:19px;font-weight:700;color:#fff;font-family:'Playfair Display',serif;text-align:center}
.ss-lbl{font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em;text-align:center;margin-top:1px}

/* ── ONBOARDING ── */
#onboarding{position:fixed;inset:0;z-index:400;background:var(--cream);display:flex;flex-direction:column;overflow-y:auto}
.ob-hdr{padding:20px 20px 28px;position:relative;overflow:hidden}
.ob-hdr::after{content:'';position:absolute;bottom:-20px;left:0;right:0;height:40px;background:var(--cream);border-radius:40px 40px 0 0}
.ob-back-btn{background:rgba(255,255,255,.2);border:none;width:36px;height:36px;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ob-dots{display:flex;gap:6px;margin-bottom:12px}
.ob-dot{height:4px;border-radius:2px;transition:all .3s}
.ob-body{padding:26px 20px 110px}
.ob-footer{position:fixed;bottom:0;left:0;right:0;padding:14px 20px 20px;background:rgba(253,248,242,.96);backdrop-filter:blur(12px);border-top:1px solid rgba(196,184,174,.2)}
.plan-opt{border-radius:var(--r);padding:16px;border:2px solid #E8E0D6;cursor:pointer;transition:all .2s;margin-bottom:12px;background:#fff;position:relative}
.plan-opt.sel{border-color:var(--saffron);background:#FEF9F6;box-shadow:0 0 0 3px rgba(232,114,42,.12)}
.plan-opt-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.plan-opt-name{font-size:16px;font-weight:700}
.plan-opt-price{font-size:20px;font-weight:700;font-family:'Playfair Display',serif;color:var(--saffron)}
.plan-feats{list-style:none;display:flex;flex-direction:column;gap:5px}
.plan-feats li{font-size:12px;color:var(--ink60);display:flex;gap:6px;align-items:flex-start}
.plan-feats li::before{content:'✓';color:var(--teal);font-weight:700;flex-shrink:0}
.chk-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink30);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:12px}
.plan-opt.sel .chk-circle{background:var(--saffron);border-color:var(--saffron);color:#fff}

/* ── NAV ── */
.nav{position:sticky;top:0;z-index:100;background:rgba(253,248,242,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(196,184,174,.25);padding:0 16px;height:58px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:9px;cursor:pointer}
.nav-logo-icon{width:36px;height:36px;border-radius:10px;overflow:hidden;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-logo-text{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);line-height:1.1}
.nav-logo-sub{font-size:9px;color:var(--teal);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.user-pill{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600}
.up-patient{background:var(--teal-pale);color:var(--teal)}
.up-hospital{background:#FEF3E2;color:var(--saffron-dk)}
.switch-btn{font-size:11px;color:var(--ink60);cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;font-weight:500;text-decoration:underline;padding:4px}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(253,248,242,.96);backdrop-filter:blur(14px);border-top:1px solid rgba(196,184,174,.25);display:flex;height:66px;box-shadow:0 -3px 20px rgba(26,20,16,.07)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;color:var(--ink60);font-size:10px;font-weight:500;font-family:'DM Sans',sans-serif;transition:color .2s}
.bni .bi{font-size:21px;transition:transform .2s}
.bni.on{color:var(--saffron)}
.bni.on .bi{transform:scale(1.12)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,var(--saffron),var(--saffron-dk));color:#fff;box-shadow:0 4px 14px rgba(232,114,42,.35)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,114,42,.45)}
.btn-t{background:linear-gradient(135deg,var(--teal),#065C52);color:#fff;box-shadow:0 4px 14px rgba(11,123,110,.28)}
.btn-t:hover{transform:translateY(-1px)}
.btn-o{background:transparent;color:var(--saffron);border:1.5px solid var(--saffron)}
.btn-o:hover{background:rgba(232,114,42,.08)}
.btn-g{background:rgba(26,20,16,.05);color:var(--ink)}
.btn-g:hover{background:rgba(26,20,16,.1)}
.btn-d{background:var(--rose);color:#fff}
.sm{padding:7px 13px;font-size:12px;border-radius:9px}
.lg{padding:14px 28px;font-size:15px;border-radius:14px}
.fw{width:100%}

/* ── CARDS ── */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.cb{padding:16px}

/* ── HOSPITAL CARD ── */
.hcard{cursor:pointer;margin-bottom:14px}
.hcard-top{height:116px;background:linear-gradient(135deg,var(--teal-pale),#d0ede9);position:relative;display:flex;align-items:center;padding:14px;gap:12px}
.hcard-logo{width:60px;height:60px;border-radius:13px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.hcard-info h3{font-size:15px;font-weight:700;line-height:1.3}
.hcard-info p{font-size:11px;color:var(--ink60);margin-top:2px}
.hcard-bdgs{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.ribbon{position:absolute;top:0;right:0;background:var(--gold);color:#fff;font-size:9px;font-weight:700;padding:4px 10px 4px 14px;border-radius:0 0 0 12px;letter-spacing:.06em}
.stat-row{display:flex;border-top:1px solid #F0EBE4}
.stat-item{flex:1;padding:10px 6px;text-align:center;border-right:1px solid #F0EBE4}
.stat-item:last-child{border-right:none}
.sv{font-size:16px;font-weight:700;color:var(--teal);line-height:1}
.sl{font-size:9px;color:var(--ink60);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.card-acts{padding:10px 14px;display:flex;gap:8px;background:var(--warm)}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.bv{background:#E6F5F3;color:var(--teal)}
.bf{background:#FEF3E2;color:#C07820}
.bp{background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff}
.bn{background:#FEE2E2;color:#DC2626}

.stars{color:#F59E0B;font-size:13px;letter-spacing:1px}

/* ── SEARCH ── */
.search-wrap{padding:14px}
.sbox{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 15px;display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:9px}
.sinput{flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:transparent}
.sinput::placeholder{color:var(--ink30)}
.frow{display:flex;gap:7px;overflow-x:auto;padding-bottom:1px}
.frow::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid var(--ink30);color:var(--ink60);cursor:pointer;transition:all .2s;background:transparent}
.chip.on{background:var(--saffron);border-color:var(--saffron);color:#fff}

/* ── HERO ── */
.hero{background:linear-gradient(160deg,#0B7B6E 0%,#065C52 55%,#1A1410 100%);padding:28px 20px 34px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:rgba(232,114,42,.12);pointer-events:none}
.hero-eye{font-size:10px;font-weight:600;color:var(--saffron-lt);letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
.hero h1{font-size:25px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:9px}
.hero h1 span{color:var(--saffron-lt)}
.hero-p{font-size:13px;color:rgba(255,255,255,.62);line-height:1.65;margin-bottom:18px}
.hero-stats{display:flex;gap:20px}
.hsv{font-size:20px;font-weight:700;color:#fff;font-family:'Playfair Display',serif}
.hsl{font-size:9px;color:rgba(255,255,255,.5);margin-top:1px;text-transform:uppercase;letter-spacing:.08em}

/* ── SECTIONS ── */
.sec{padding:18px 16px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sec-title{font-size:18px;font-weight:700}
.sec-link{font-size:13px;color:var(--teal);font-weight:600;cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif}

.trust-row{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;margin-top:-6px}
.trust-row::-webkit-scrollbar{display:none}
.trust-card{flex-shrink:0;width:98px;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:11px;text-align:center}
.ti{font-size:20px;margin-bottom:4px}
.tl{font-size:10px;font-weight:600;color:var(--ink);line-height:1.4}

.tag-list{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:500;background:var(--teal-pale);color:var(--teal)}
.tag-o{background:#FEF3E2;color:var(--saffron-dk)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(26,20,16,.55);backdrop-filter:blur(5px);display:flex;align-items:flex-end;animation:fadeIn .2s ease}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;animation:slideUp .28s ease;padding-bottom:28px}
.handle{width:36px;height:4px;background:var(--ink30);border-radius:2px;margin:12px auto 16px}
.mhdr{padding:0 18px 14px;border-bottom:1px solid #F0EBE4}
.mtitle{font-size:20px;font-weight:700}
.mclose{float:right;font-size:22px;cursor:pointer;color:var(--ink60);background:none;border:none;line-height:1;padding:0}
.mbody{padding:18px}

/* ── FORM ── */
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px}
.fi{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid #E8E0D6;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);outline:none;transition:border-color .2s;background:#FDFAF6}
.fi:focus{border-color:var(--saffron)}
.fhint{font-size:10px;color:var(--ink60);margin-top:3px}
textarea.fi{resize:vertical;min-height:75px}

/* ── TAB BAR ── */
.tab-bar{display:flex;background:#fff;border-radius:12px;padding:3px;box-shadow:inset 0 1px 4px rgba(0,0,0,.06);margin:0 16px 14px}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--ink60);border:none;background:transparent;font-family:'DM Sans',sans-serif}
.tab.on{background:var(--saffron);color:#fff;box-shadow:0 2px 8px rgba(232,114,42,.3)}

/* ── ANALYTICS ── */
.ag{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.ac{background:#fff;border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.av{font-size:26px;font-weight:700}
.al{font-size:11px;color:var(--ink60);margin-top:1px}
.at{font-size:10px;font-weight:600;margin-top:5px}
.up{color:#16A34A}.dn{color:var(--rose)}

/* ── PLAN CARDS ── */
.plan-card{border-radius:var(--r);padding:18px;border:2px solid transparent;cursor:pointer;transition:all .25s;margin-bottom:13px;position:relative}
.pc-basic{background:#fff;border-color:#E8E0D6}
.pc-pro{background:linear-gradient(135deg,#FEF9F1,#FFF3E0);border-color:var(--saffron)}
.pc-premium{background:linear-gradient(135deg,#1A1410,#2D2418);border-color:var(--gold)}
.pc-sel{box-shadow:0 0 0 3px rgba(232,114,42,.3)}
.pc-name{font-size:17px;font-weight:700;margin-bottom:4px}
.pc-price{font-size:26px;font-weight:700;font-family:'Playfair Display',serif}
.pc-period{font-size:12px;color:var(--ink60)}
.pc-feats{list-style:none;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.pc-feats li{font-size:12px;display:flex;align-items:flex-start;gap:7px}
.pc-feats li::before{content:'✓';color:var(--teal);font-weight:700;flex-shrink:0;margin-top:1px}
.pc-premium .pc-name{color:#F5EBD0}
.pc-premium .pc-price{color:var(--gold)}
.pc-premium .pc-period,.pc-premium .pc-feats li{color:rgba(255,255,255,.7)}
.pc-premium .pc-feats li::before{color:var(--gold)}
.plan-badge{position:absolute;top:-10px;right:16px;background:var(--saffron);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px}

/* ── LEAD ── */
.lcard{padding:15px;border-bottom:1px solid #F0EBE4}
.lcard:last-child{border-bottom:none}
.lhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.lid{font-size:12px;font-weight:700;color:var(--ink60)}
.ltime{font-size:10px;color:var(--ink30)}
.lrow{display:flex;gap:7px;font-size:12px;color:var(--ink60);margin-bottom:4px;align-items:center}
.ubox{background:var(--teal-pale);border-radius:10px;padding:10px;text-align:center;margin:9px 0 8px}
.uprice{font-size:16px;font-weight:700;color:var(--teal)}
.usub{font-size:10px;color:var(--ink60)}
.ubox-done{background:#D1FAE5;border-radius:10px;padding:9px;font-size:12px;color:#065F46;font-weight:600;margin-top:8px}

/* ── REVIEW ── */
.rcard{padding:15px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:11px}
.rhdr{display:flex;justify-content:space-between;margin-bottom:7px}
.rname{font-size:13px;font-weight:700}
.rdate{font-size:11px;color:var(--ink60)}
.rtext{font-size:12px;color:var(--ink60);line-height:1.6;margin-top:5px}
.vtag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--teal);font-weight:600;margin-top:5px}

/* ── ADMIN ── */
.arow{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #F0EBE4}
.arow:last-child{border-bottom:none}
.sp{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.sp-p{background:#FEF3CD;color:#856404}
.sp-a{background:#D1FAE5;color:#065F46}
.sp-r{background:#FEE2E2;color:#991B1B}

/* ── MISC ── */
.fb{display:flex;justify-content:space-between;align-items:center}
.prog{height:5px;border-radius:3px;background:#F0EBE4;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--teal-lt));transition:width .7s ease}
.city-chip{flex-shrink:0;padding:8px 14px;border-radius:10px;background:#fff;box-shadow:var(--shadow);font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);border:none;font-family:'DM Sans',sans-serif;transition:all .2s}
.city-chip:hover{background:var(--teal);color:#fff}
.empty{text-align:center;padding:48px 24px}
.ei{font-size:52px;margin-bottom:12px}
.et{font-size:17px;font-weight:700;margin-bottom:7px}
.es{font-size:13px;color:var(--ink60);line-height:1.65}
.ibox{border-radius:12px;padding:12px;font-size:12px;line-height:1.6}
.ib-s{background:#FEF3E2;color:var(--saffron-dk)}

function stars(n) {
  return '<span class="stars">' + '★'.repeat(Math.floor(n)) + '☆'.repeat(5 - Math.floor(n)) + '</span>';
}
function bdg(t, l) {
  return '<span class="badge b' + t + '">' + l + '</span>';
}
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  el.className = 'toast';
  setTimeout(function() {
    el.className = 'toast out';
    setTimeout(function() { el.style.display = 'none'; }, 300);
  }, 2500);
}

function obDots(total, cur) {
  var html = '';
  for (var i = 0; i < total; i++) {
    if (i < cur) html += '<div class="ob-dot" style="width:8px;background:rgba(255,255,255,.7)"></div>';
    else if (i === cur) html += '<div class="ob-dot" style="width:24px;background:#fff"></div>';
    else html += '<div class="ob-dot" style="width:8px;background:rgba(255,255,255,.3)"></div>';
  }
  return html;
}

// ── Main Render ─────────────────────────────────────────────────────────────
function navigate(pg) { S.page = pg; render(); }

function render() {
  renderNav();
  renderBNav();
  var c = document.getElementById('main-page');
  if (S.role === 'patient') {
    if (S.page === 'home' || S.page === 'search') c.innerHTML = renderHome();
    else if (S.page === 'requests') c.innerHTML = renderRequests();
    else if (S.page === 'profile') c.innerHTML = renderPatientProfile();
    else c.innerHTML = renderHome();
  } else if (S.role === 'hospital') {
    if (S.page === 'dash' || S.page === 'leads') c.innerHTML = renderDash();
    else if (S.page === 'plans') c.innerHTML = renderPlans();
    else if (S.page === 'profile') { S.dtab = 'profile'; c.innerHTML = renderDash(); }
    else c.innerHTML = renderDash();
  } else {
    c.innerHTML = renderAdmin();
  }
  if (S.modalH !== null) renderModal();
  if (S.unlockIdx !== null) renderUnlockModal();
  // stagger card animations
  var cards = document.querySelectorAll('.hcard');
  for (var i = 0; i < cards.length; i++) {
    cards[i].style.animation = 'fadeUp .4s ' + (i * 0.07) + 's ease both';

  var nr = document.getElementById('nav-right');

  LEADS[idx].unlocked = true;

  render();

<script>
// ── API INTEGRATION LAYER ─────────────────────────────────────
const API_BASE = 'https://fertilityconnect-india-production.up.railway.app/api';

const Token = {
  get:      ()    => localStorage.getItem('fc_access'),
  getRef:   ()    => localStorage.getItem('fc_refresh'),
  set:      (a,r) => { localStorage.setItem('fc_access',a); localStorage.setItem('fc_refresh',r); },
  clear:    ()    => { ['fc_access','fc_refresh','fc_user'].forEach(k=>localStorage.removeItem(k)); },
  getUser:  ()    => { try{ return JSON.parse(localStorage.getItem('fc_user')); }catch{ return null; } },
  setUser:  (u)   => localStorage.setItem('fc_user', JSON.stringify(u)),
  isLoggedIn: ()  => !!localStorage.getItem('fc_access'),
};

async function apiFetch(method, path, body, auth=false) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && Token.get()) headers['Authorization'] = 'Bearer ' + Token.get();
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  try {
    let res = await fetch(API_BASE + path, opts);
    if (res.status === 401 && auth) {
      try {
        const r  = await fetch(API_BASE + '/auth/refresh', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ refresh_token: Token.getRef() }) });
        const rd = await r.json();
        if (rd.success) {
          Token.set(rd.data.tokens.accessToken, rd.data.tokens.refreshToken);
          headers['Authorization'] = 'Bearer ' + Token.get();
          res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body):undefined });
        }
      } catch(_) {}
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Request failed');
    return data;
  } catch(err) {
    if (err.message.includes('fetch') || err.message.includes('Failed')) {
      console.warn('[API] Backend not reachable — demo mode');
      throw new Error('DEMO_MODE');
    }
    throw err;
  }
}

// Override quickLogin to call real API with demo fallback
var _qlOriginal = window.quickLogin;
window.quickLogin = async function(role) {
  document.getElementById('login-modal')?.remove();
  document.getElementById('onboarding').style.display = 'none';
  try {
    const creds = role === 'patient'
      ? { identifier:'+919999999999', password:'Patient@123' }
      : { identifier:'+919876543210', password:'Hospital@123' };
    const data = await apiFetch('POST', '/auth/login', creds);
    Token.set(data.data.tokens.accessToken, data.data.tokens.refreshToken);
    Token.setUser(data.data.user);
    if (role === 'patient') {
      S.user = { name:data.data.user.full_name, city:'Mumbai', role:'patient' };
    } else {
      const h = data.data.hospital || {};
      S.user = { name:h.name||'Nova IVF', city:h.city||'Mumbai', role:'hospital', plan:h.tier||'pro' };
    }
    showToast('✅ Logged in via API!');
  } catch(err) {
    // Fallback demo
    S.user = role==='patient'
      ? { name:'Priya Sharma', city:'Mumbai', role:'patient' }
      : { name:'Nova IVF Fertility', city:'Mumbai', role:'hospital', plan:'pro' };
    if (err.message !== 'DEMO_MODE') showToast('Demo mode — backend not connected');
  }
  S.role = role; S.page = role==='patient'?'home':'dash';
  document.getElementById('app').style.display = 'flex';
  render(); showToast('🎉 Welcome back!');
};

// Override finishPatientOB to call real register API
var _fpOriginal = window.finishPatientOB;
window.finishPatientOB = async function() {
  if (S.obPhone && S.obName) {
    try {
      const data = await apiFetch('POST', '/auth/register', {
        role:'patient', full_name:S.obName, phone:S.obPhone.replace(/\s+/g,''),
        password:'Temp@' + S.obPhone.slice(-4) + '1A',
      });
      Token.set(data.data.tokens.accessToken, data.data.tokens.refreshToken);
      Token.setUser(data.data.user);
      if (data.dev_otp) showToast('📱 Dev OTP: ' + data.dev_otp);
    } catch(err) { console.warn('Register:', err.message); }
  }
  S.user = { name:S.obName||'Patient', city:S.obCity||'All', role:'patient' };
  S.city = S.obCity||'All'; S.role='patient'; S.page='home';
  document.getElementById('onboarding').style.display='none';
  document.getElementById('app').style.display='flex';
  render(); showToast('🌸 Welcome, ' + (S.obName||'').split(' ')[0] + '!');
};

// Load real hospitals from API after home renders
var _rnOriginal = window.renderHome;
window.renderHome = function() {
  var html = _rnOriginal();
  setTimeout(async function() {
    try {
      var params = new URLSearchParams();
      if (S.city !== 'All') params.set('city', S.city);
      if (S.query) params.set('search', S.query);
      var data = await apiFetch('GET', '/hospitals?' + params.toString());
      if (data.data.hospitals && data.data.hospitals.length > 0) {
        HOS.length = 0;
        data.data.hospitals.forEach(function(h) {
          HOS.push({
            id:h.id, name:h.name, slug:h.slug, city:h.city,
            area:h.area||'', e:'🏥', founded:h.founded_year||2015,
            ivf:h.ivf_success_rate||0, price:'Check website',
            tier:h.tier||'basic', feat:h.is_featured, ver:h.is_verified,
            rating:parseFloat(h.avg_rating)||4.5, reviews:parseInt(h.review_count)||0,
            desc:h.description||'', tags:h.treatments||[],
            fac:h.facilities||[], docs:[], exp:[],
          });
        });
        render();
        console.log('[API] Loaded', HOS.length, 'hospitals from backend');
      }
    } catch(err) { console.warn('[API] Hospital list: demo mode'); }
  }, 400);
  return html;
};

  async function initPayment() {

      var options = {

        currency: 'INR',
        name: 'FertilityConnect India',

        handler: async function(response) {
          showToast('✅ Payment successful!');
          S.user.plan = plan;
          render();
        },
        prefill: { name: S.user ? S.user.name : '', contact: S.user ? S.user.phone : '' },
        theme: { color: '#E8722A' }
      };
      var rzp = new Razorpay(options);
      rzp.open();
    }
  } catch(e) { showToast('❌ Payment failed. Try again.'); }
}
